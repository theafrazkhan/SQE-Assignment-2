name: Registration tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - name: Run tests and measure coverage
        run: python -m pytest tests/ -v --junitxml=results.xml --cov=registration --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Keep results even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-evidence
          path: |
            results.xml
            coverage.xml
            htmlcov/
